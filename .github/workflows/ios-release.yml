name: iOS Build & Upload to TestFlight

on:
  # Every push to main that touches the app builds and uploads a new TestFlight
  # build. The build number is resolved from App Store Connect, so no pubspec
  # bump is needed. Changes outside the app (README, server reference) do not
  # trigger a build; use "Run workflow" for those.
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/ios-release.yml"
  workflow_dispatch:
    inputs:
      build_name:
        description: "Version name (e.g. 1.0.3). Leave blank to resolve it automatically from pubspec.yaml + App Store Connect."
        required: false
        default: ""
      build_number:
        description: "Build number (e.g. 46). Leave blank to resolve it automatically from App Store Connect."
        required: false
        default: ""

# A newer push replaces a build that is still running, so TestFlight only gets
# the latest main and the macOS minutes are not spent on stale commits.
concurrency:
  group: camtrip-ios-testflight
  cancel-in-progress: true

jobs:
  build-and-upload-ios:
    name: Build Flutter IPA and upload to TestFlight
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ── 2. Flutter ───────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      # ── 3. Code signing ──────────────────────────────────────────────────────
      # Signing is fully automatic through the App Store Connect API key (Admin
      # role): xcodebuild -allowProvisioningUpdates creates or reuses the cloud
      # managed distribution certificate and the App Store profile with every
      # capability in Runner.entitlements (Push, Sign in with Apple, Associated
      # Domains). No .p12 or .mobileprovision secrets are needed.
      #
      # Secrets required:
      #   (Key ID QS5UXPB9HY and the Issuer ID have defaults below.)
      #   APP_STORE_CONNECT_API_KEY_P8  - contents (or base64) of AuthKey_QS5UXPB9HY.p8 - the only secret you must add
      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'QS5UXPB9HY' }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          # Accept the raw .p8 text (with or without line breaks) or its base64
          # form, and always write a clean PEM: xcodebuild rejects anything else.
          RAW="$APP_STORE_CONNECT_API_KEY_P8"
          if ! printf '%s' "$RAW" | grep -q "BEGIN PRIVATE KEY"; then
            RAW=$(printf '%s' "$RAW" | tr -d ' \r\n' | base64 --decode)
          fi
          BODY=$(printf '%s' "$RAW" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \r\n\t')
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$BODY" | fold -w 64
            echo
            echo "-----END PRIVATE KEY-----"
          } > "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout && echo "API key is a valid PEM private key."
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # ── 3b. Resolve version ──────────────────────────────────────────────────
      # Asks App Store Connect which version/build numbers already exist and picks
      # the next free pair, so an unbumped pubspec.yaml can no longer fail the
      # upload with error 90062 ("must contain a higher version").
      - name: Resolve version and build number
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'QS5UXPB9HY' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || '6de0d408-c678-4c60-9a6f-572cf850399d' }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          INPUT_BUILD_NAME: ${{ github.event.inputs.build_name }}
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          PUBSPEC_PATH: app/pubspec.yaml
        run: |
          # macOS runners ship a Homebrew python that refuses system-wide pip
          # installs (PEP 668), so install into a throwaway virtualenv.
          python3 -m venv "$RUNNER_TEMP/versionvenv"
          "$RUNNER_TEMP/versionvenv/bin/python" -m pip install --quiet --disable-pip-version-check pyjwt cryptography
          "$RUNNER_TEMP/versionvenv/bin/python" .github/workflows/scripts/resolve_version.py

      # ── 4. ExportOptions ─────────────────────────────────────────────────────
      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>4K4D59MXKW</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      # ── 5. Build IPA ─────────────────────────────────────────────────────────
      - name: Build Flutter iOS (unsigned)
        working-directory: app
        env:
          REVENUECAT_APPLE_KEY: ${{ secrets.REVENUECAT_APPLE_KEY }}
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          # Reiskaart map tiles (CARTO Basemaps API key, see app/lib/features/tripmap/trip_tiles.dart).
          CARTO_BASEMAPS_KEY: ${{ vars.CARTO_BASEMAPS_KEY }}
        run: |
          # BUILD_NAME / BUILD_NUMBER come from the "Resolve version" step.
          echo "Building $BUILD_NAME ($BUILD_NUMBER)"

          # Fall back to the defaults in config.dart when the variables are not set.
          if [ -z "${GOOGLE_IOS_CLIENT_ID:-}" ]; then
            GOOGLE_IOS_CLIENT_ID=$(sed -n "s/.*googleIosClientIdDefault = '\([^']*\)'.*/\1/p" lib/core/config.dart | head -n1)
          fi
          # Google Sign-In on iOS needs the client id + its reversed form as URL scheme.
          if [ -n "${GOOGLE_IOS_CLIENT_ID:-}" ]; then
            REVERSED=$(echo "$GOOGLE_IOS_CLIENT_ID" | awk -F. '{for(i=NF;i>0;i--) printf "%s%s",$i,(i>1?".":"")}')
            printf 'GOOGLE_IOS_CLIENT_ID=%s\nGOOGLE_REVERSED_CLIENT_ID=%s\n' "$GOOGLE_IOS_CLIENT_ID" "$REVERSED" > ios/Flutter/Secrets.xcconfig
          fi

          # Only pass defines that are set, so the defaults in config.dart stay
          # in effect otherwise (an empty define would override them).
          DEFINES=()
          for v in REVENUECAT_APPLE_KEY GOOGLE_IOS_CLIENT_ID GOOGLE_SERVER_CLIENT_ID CARTO_BASEMAPS_KEY; do
            if [ -n "${!v:-}" ]; then DEFINES+=("--dart-define=$v=${!v}"); fi
          done

          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            "${DEFINES[@]}"

      - name: Archive and export signed IPA
        working-directory: app/ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'QS5UXPB9HY' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || '6de0d408-c678-4c60-9a6f-572cf850399d' }}
        run: |
          set -euo pipefail
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$ASC_KEY_PATH"
                -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"
                -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID")

          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            "${AUTH[@]}" \
            archive \
            DEVELOPMENT_TEAM=4K4D59MXKW \
            CODE_SIGN_STYLE=Automatic

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath ../build/ios/ipa \
            "${AUTH[@]}"

          IPA_PATH=$(find ../build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "${IPA_PATH:-}" ]; then
            echo "No IPA file produced."
            exit 1
          fi

          TMP_UNZIP_DIR="$RUNNER_TEMP/ipa_unzip"
          rm -rf "$TMP_UNZIP_DIR"
          mkdir -p "$TMP_UNZIP_DIR"
          unzip -q "$IPA_PATH" -d "$TMP_UNZIP_DIR"

          APP_PATH=$(find "$TMP_UNZIP_DIR/Payload" -maxdepth 2 -name "*.app" | head -1)
          ENTITLEMENTS_PATH="$RUNNER_TEMP/ipa-entitlements.plist"
          if [ -z "${APP_PATH:-}" ]; then
            echo "Could not find .app in exported IPA payload."
            exit 1
          fi

          if codesign -d --entitlements :- "$APP_PATH" > "$ENTITLEMENTS_PATH" 2>/dev/null; then
            if /usr/libexec/PlistBuddy -c "Print com.apple.developer.applesignin" "$ENTITLEMENTS_PATH" >/dev/null 2>&1; then
              echo "Verified: Sign in with Apple entitlement exists in exported IPA."
            else
              echo "::warning::Export succeeded, but com.apple.developer.applesignin is missing from app entitlements in IPA."
              echo "::warning::Apple Sign In may fail at runtime (AuthorizationError 1000) unless the profile/capability setup is corrected."
            fi
          else
            echo "::warning::Could not read codesign entitlements from exported app. Continuing because IPA export succeeded."
          fi

      # ── 6. Upload to TestFlight ───────────────────────────────────────────────
      # Secrets required:
      #   APP_STORE_CONNECT_KEY_ID      — Key ID from App Store Connect API key page
      #   APP_STORE_CONNECT_ISSUER_ID   — Issuer ID from App Store Connect API key page
      #   APP_STORE_CONNECT_API_KEY_P8  — base64 of the downloaded .p8 private key file

      - name: Upload IPA to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'QS5UXPB9HY' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || '6de0d408-c678-4c60-9a6f-572cf850399d' }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail

          IPA_PATH=$(find app/build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          # altool can exit 0 even when Apple rejects the build, so capture the
          # output and fail explicitly on any reported upload error.
          UPLOAD_LOG="$RUNNER_TEMP/altool-upload.log"
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose 2>&1 | tee "$UPLOAD_LOG"
          ALTOOL_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$ALTOOL_EXIT" -ne 0 ] || grep -qiE "UPLOAD FAILED|Failed to upload package|ERROR:" "$UPLOAD_LOG"; then
            # Print what Apple actually said. The generic "bump the version"
            # advice used to stand in for every failure, which sent the reader
            # editing version numbers over problems that had nothing to do with
            # them.
            REASON=$(awk -F'"' '/description/ {print $(NF-1)}' "$UPLOAD_LOG" | sort -u | head -5)
            echo "::error::TestFlight upload failed as $BUILD_NAME ($BUILD_NUMBER)."
            if [ -n "${REASON:-}" ]; then
              echo "$REASON" | while read -r line; do echo "::error::$line"; done
            else
              echo "::error::No error description in the altool output; see the full log above."
            fi
            exit 1
          fi
          echo "Upload accepted by App Store Connect."

      # ── 7. Cleanup ───────────────────────────────────────────────────────────
      - name: Remove API key
        if: always()
        run: rm -f "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8
